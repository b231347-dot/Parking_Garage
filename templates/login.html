<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parkflow Staff Login</title><link rel="stylesheet" href="/static/customer.css"></head><body><main class="customer-shell"><header class="customer-header"><a class="brand" href="/customer"><b>Parkflow</b><span>Staff access</span></a></header><section class="card" style="max-width:460px;margin:12vh auto"><p class="eyebrow">ATTENDANT PORTAL</p><h1>Welcome back</h1><p>Sign in to manage the garage.</p><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="8"></label><p id="error" class="error"></p><button class="primary-button">Sign in</button></form><p class="fine-print">First time here? <a href="#" id="signup-link">Create staff account</a></p></section></main><script>const form=document.querySelector('#login-form');form.addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(r.ok)location='/';else document.querySelector('#error').textContent=(await r.json()).detail});document.querySelector('#signup-link').onclick=async e=>{e.preventDefault();const name=prompt('Your name');const email=prompt('Work email');const password=prompt('Password (8+ characters)');if(!name||!email||!password)return;const r=await fetch('/api/auth/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,email,password})});if(r.ok)location='/';else document.querySelector('#error').textContent=(await r.json()).detail};</script></body></html>
